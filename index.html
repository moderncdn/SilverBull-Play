<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>The Silver Bull</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <!-- "Add to Home Screen" opens the game full screen, with the bull as its icon -->
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="TemplateData/icon-180.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Silver Bull">
    <meta name="theme-color" content="#07040d">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">The Silver Bull</div>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      // Phones and tablets: a screen whose main pointer is a finger, or an iPad (which tells websites it's a Mac).
      // ?touch=1 or ?touch=0 in the address overrides it. The game asks the same thing (SilverBullTouch.jslib)
      // to decide whether to show its on-screen controls.
      var forcedTouch = /[?&]touch=([01])/.exec(location.search);
      var touchDevice = forcedTouch ? forcedTouch[1] === "1"
        : !!(window.matchMedia && window.matchMedia("(pointer: coarse)").matches) ||
          (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));
      window.sbTouchDevice = touchDevice;

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebGL.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGL.data.unityweb",
        frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
        codeUrl: buildUrl + "/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "The Silver Bull",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
      };

      if (touchDevice || /iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Phone or tablet: the game fills the screen.
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.documentElement.className = "unity-mobile";
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";

        // Phones have up to 3 screen pixels per CSS pixel; drawing every one of them would cost more than a
        // 1080p monitor. 1.5 keeps it sharp and much lighter.
        config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 1.5);

        // The first tap goes full screen and holds the game sideways, where the browser allows it
        // (Android; iPhones only go full screen from the home screen icon).
        var goFullscreen = function () {
          document.removeEventListener("touchend", goFullscreen);
          var root = document.documentElement;
          var request = root.requestFullscreen || root.webkitRequestFullscreen;
          if (!request || document.fullscreenElement || document.webkitFullscreenElement) return;
          try {
            var done = request.call(root, { navigationUI: "hide" });
            if (done && done.then) done.then(function () {
              if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(function () {});
            }).catch(function () {});
          } catch (e) {}
        };
        if (touchDevice) document.addEventListener("touchend", goFullscreen);


      } else {
        // Desktop style: Render the game canvas in a window that can be maximized to fullscreen:
        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
              }).then((unityInstance) => {
                document.querySelector("#unity-loading-bar").style.display = "none";
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                  unityInstance.SetFullscreen(1);
                };
              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);

    </script>
  </body>
</html>
